<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE07A"/>
      <stop offset="50%" stop-color="#E6B800"/>
      <stop offset="100%" stop-color="#A8800F"/>
    </linearGradient>

    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4EFE4"/>
    </radialGradient>

    <!-- Text path arcs for the three virtues
         (tightened so letters sit just inside the outer ring,
          almost touching both the inner monogram circle and the gold band) -->
    <path id="loveArc"    d="M 92,356 A 215,215 0 0 1 244,92"   fill="none"/>
    <path id="faithArc"   d="M 356,92 A 215,215 0 0 1 508,356"  fill="none"/>
    <path id="courageArc" d="M 127,473 A 245,245 0 0 0 473,473" fill="none"/>

    <!-- Clip path so the horse stays inside the inner monogram circle -->
    <clipPath id="innerClip">
      <circle cx="300" cy="300" r="208"/>
    </clipPath>
  </defs>

  <!-- ===== Rings (outside in) — tightened to hug the virtue words ===== -->
  <circle cx="300" cy="300" r="265" fill="#1B3A5C"/>
  <circle cx="300" cy="300" r="256" fill="url(#goldGradient)"/>
  <circle cx="300" cy="300" r="250" fill="url(#bgGradient)"/>

  <!-- Inner monogram circle (now bigger: r=210, was r=180) -->
  <circle cx="300" cy="300" r="210" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="4"/>
  <circle cx="300" cy="300" r="204" fill="none" stroke="url(#goldGradient)" stroke-width="1.5"/>

  <!-- ===== Horse silhouette (opaque, clipped to inner circle) ===== -->
  <g clip-path="url(#innerClip)">
    <image x="125" y="135"
           width="350" height="307"
           preserveAspectRatio="xMidYMid meet"
           xlink:href="data:image/png;base64,"/>
  </g>

  <!-- ===== Golden crown above the K ===== -->
  <g transform="translate(300, 217)">
    <rect x="-55" y="20" width="110" height="14" rx="2"
          fill="url(#goldGradient)" stroke="#7A5C0A" stroke-width="1.2"/>
    <path d="M -55,20 L -45,-15 L -25,5 L 0,-30 L 25,5 L 45,-15 L 55,20 Z"
          fill="url(#goldGradient)" stroke="#7A5C0A" stroke-width="1.5"
          stroke-linejoin="round"/>
    <circle cx="-45" cy="-15" r="4.5" fill="#C8102E" stroke="#7A5C0A" stroke-width="0.8"/>
    <circle cx="0"   cy="-30" r="6"   fill="#1E5BA8" stroke="#7A5C0A" stroke-width="0.8"/>
    <circle cx="45"  cy="-15" r="4.5" fill="#0B5D2E" stroke="#7A5C0A" stroke-width="0.8"/>
    <circle cx="-30" cy="27" r="3" fill="#C8102E"/>
    <circle cx="0"   cy="27" r="3" fill="#FFFFFF" stroke="#7A5C0A" stroke-width="0.6"/>
    <circle cx="30"  cy="27" r="3" fill="#1E5BA8"/>
  </g>

  <!-- ===== RKA monogram (gold, on top of horse, with subtle outline for legibility) ===== -->
  <text x="300" y="380"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="162" font-weight="700" text-anchor="middle"
        fill="url(#goldGradient)"
        stroke="#0A0A0A" stroke-width="6"
        paint-order="stroke fill"
        letter-spacing="2">RKA</text>

  <!-- ===== Curved virtue words ===== -->
  <text font-family="Georgia, 'Times New Roman', serif"
        font-size="42" font-weight="700" letter-spacing="8" fill="#E91E8C">
    <textPath href="#loveArc" startOffset="50%" text-anchor="middle">LOVE</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif"
        font-size="42" font-weight="700" letter-spacing="8" fill="#1E5BA8">
    <textPath href="#faithArc" startOffset="50%" text-anchor="middle">FAITH</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif"
        font-size="42" font-weight="700" letter-spacing="8" fill="#0B5D2E">
    <textPath href="#courageArc" startOffset="50%" text-anchor="middle">COURAGE</textPath>
  </text>
</svg>
